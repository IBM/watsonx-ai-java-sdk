name: Hotfix Release
run-name: Hotfix ${{ inputs.version }} from ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Hotfix version (e.g. 0.30.1)"
        required: true
      branch:
        description: "Hotfix branch to release from (e.g. hotfix/0.30.1)"
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_BOT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid version '$VERSION'. Expected X.Y.Z, otherwise the tag does not match the release workflow trigger and nothing is published to Maven Central."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error ::Tag $VERSION already exists."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify the hotfix branch
        run: |
          if ! ./mvnw initialize license:check formatter:validate -B -ntp; then
            echo "::error ::License or formatting check failed."
            echo "::error ::Please run 'mvn compile' on ${{ inputs.branch }} and commit the result before releasing."
            exit 1
          fi
          ./mvnw verify -B -ntp
          if ! git diff --quiet; then
            echo "::error ::The build modified tracked files, releasing would commit them as part of the release."
            git diff --stat
            exit 1
          fi

      - name: Update pom.xml to hotfix version
        run: |
          ./mvnw versions:set -DnewVersion=${{ inputs.version }}
          ./mvnw versions:set -f samples/pom.xml -DnewVersion=${{ inputs.version }}

      - name: Update README.md
        run: |
          sed -E -i "s|(<version>)[^<]*(</version>)|\1${{ inputs.version }}\2|" README.md
          sed -E -i "s|(com\.ibm\.watsonx:watsonx-ai:)[0-9]+\.[0-9]+\.[0-9]+|\1${{ inputs.version }}|" README.md

      - name: Update SDK version in docusaurus.config.ts
        run: |
          sed -E -i "s|(sdkVersion:[[:space:]]*')[^']*(')|\1${{ inputs.version }}\2|" docs/docusaurus.config.ts

      - name: Commit and push hotfix branch
        uses: ./.github/actions/commit-push
        with:
          commit_message: "Prepare release ${{ inputs.version }}"
          token: ${{ secrets.GH_BOT_TOKEN }}
          branch: ${{ inputs.branch }}

      - name: Tag and push
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ inputs.version }}"
          name: "${{ inputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GH_BOT_TOKEN }}

      - name: Sync main to the hotfix version
        run: |
          git checkout main
          git pull origin main
          sed -E -i "s|(<version>)[^<]*(</version>)|\1${{ inputs.version }}\2|" README.md
          sed -E -i "s|(com\.ibm\.watsonx:watsonx-ai:)[0-9]+\.[0-9]+\.[0-9]+|\1${{ inputs.version }}|" README.md
          sed -E -i "s|(sdkVersion:[[:space:]]*')[^']*(')|\1${{ inputs.version }}\2|" docs/docusaurus.config.ts
          sed -E -i "s|(current-version:[[:space:]]*\").*(\")|\1${{ inputs.version }}\2|" .github/project.yml

      - name: Commit and push main
        uses: ./.github/actions/commit-push
        with:
          commit_message: "Sync main to ${{ inputs.version }}"
          token: ${{ secrets.GH_BOT_TOKEN }}
          branch: main
